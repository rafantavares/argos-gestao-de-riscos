<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0B0E14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Argos</title>
    <script>
      // Aplica o modo (claro/escuro), a escala, o tamanho do texto e o movimento
      // salvos antes de desenhar a página.
      try {
        var modo = localStorage.getItem("mui-mode");
        if (modo === "system") modo = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-tema", modo === "light" ? "light" : "dark");
        if (localStorage.getItem("argos.escala") === "daltonico") document.documentElement.setAttribute("data-escala", "daltonico");
        var texto = localStorage.getItem("argos.texto");
        if (texto === "grande" || texto === "maior") document.documentElement.setAttribute("data-texto", texto);
        if (localStorage.getItem("argos.movimento") === "reduzido") document.documentElement.setAttribute("data-movimento", "reduzido");
      } catch (e) {
        document.documentElement.setAttribute("data-tema", "dark");
      }
    </script>
    <style>
      html, body { background: #0B0E14; }
      html[data-tema="light"], html[data-tema="light"] body { background: #F6F8FB; }
      .splash { min-height: 100vh; display: grid; place-items: center; }
      .splash img { width: 56px; height: 56px; animation: respirar 1.6s ease-in-out infinite; }
      @keyframes respirar { 50% { opacity: 0.45; } }
      @media (prefers-reduced-motion: reduce) { .splash img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="splash"><img src="/favicon.svg" alt="Carregando o Argos" /></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
