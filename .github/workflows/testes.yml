# Roda a suíte do backend a cada push e pull request. Os testes usam SQLite em
# memória e simulam o ML e o Gemini, então não precisam de banco nem de chaves.
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_CHAVE_SECRETA: chave-so-para-testes
      DATABASE_URL: sqlite://
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
